<!DOCTYPE html><meta charset=utf-8><title>Plantroom Labs brand</title>
<style>
body{margin:0;background:#f4f5f8;font:13px/1.5 ui-sans-serif,system-ui,sans-serif;color:#5f6b7c}
h2{font:600 11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
   color:#97a2b3;margin:0 0 16px;padding:0 0 8px;border-bottom:1px solid #e2e5ec}
section{padding:28px 32px}
.row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e2e5ec;border-radius:10px;padding:20px 24px}
.card.dark{background:#0e1116;border-color:#2a303a}
.lab{font:10px/1 ui-monospace,monospace;letter-spacing:.06em;color:#97a2b3;margin-top:10px}
img{display:block}
</style>
<section><h2>Horizontal lockup</h2><div class="row">
<div class="card"><img src="logo-horizontal-light.svg" height="60"><div class=lab>logo-horizontal-light</div></div>
<div class="card dark" style="padding:0"><img src="logo-horizontal-dark.svg" height="80"></div>
</div></section>
<section><h2>Horizontal, no tagline</h2><div class="row">
<div class="card"><img src="logo-horizontal-notag-light.svg" height="44"><div class=lab>notag-light</div></div>
<div class="card dark" style="padding:0"><img src="logo-horizontal-notag-dark.svg" height="70"></div>
<div class="card"><img src="logo-horizontal-light.svg" height="30"><div class=lab>at 30px tall</div></div>
</div></section>
<section><h2>Stacked</h2><div class="row">
<div class="card"><img src="logo-stacked-light.svg" height="110"><div class=lab>stacked-light</div></div>
<div class="card dark"><img src="logo-stacked-dark.svg" height="110"></div>
</div></section>
<section><h2>Badge / app icon</h2><div class="row">
<div class="card"><img src="badge-dark.svg" width="96"><div class=lab>96</div></div>
<div class="card"><img src="badge-dark.svg" width="48"><div class=lab>48</div></div>
<div class="card"><img src="badge-dark.svg" width="32"><div class=lab>32</div></div>
<div class="card"><img src="badge-dark-small.svg" width="32"><div class=lab>32 small</div></div>
<div class="card"><img src="badge-dark-small.svg" width="16"><div class=lab>16 small</div></div>
<div class="card"><img src="badge-light.svg" width="48"><div class=lab>light</div></div>
<div class="card"><img src="badge-mono.svg" width="48"><div class=lab>mono</div></div>
</div></section>
<section><h2>Mark alone</h2><div class="row">
<div class="card"><img src="mark-accent.svg" width="72"></div>
<div class="card dark"><img src="mark-on-dark.svg" width="72"></div>
<div class="card"><img src="mark-accent.svg" width="24"><div class=lab>24</div></div>
<div class="card"><img src="mark-small.svg" width="16" style="color:#7b61ff"><div class=lab>16 small</div></div>
</div></section>
<section><h2>One colour</h2><div class="row">
<div class="card"><img src="logo-horizontal-black.svg" height="54"></div>
<div class="card dark"><img src="logo-horizontal-white.svg" height="54"></div>
</div></section>
